# ---- Selected research ------------------------------------------------------
# Each item reads as: <name, as a link> <text>
selected_research:
  - name: "Escape (S&P 2027)"
    link: "https://eprint.iacr.org/2026/2033"
    text: >-                                               # (Markdown)
      is a new single-server PIR that achieves 
      constant response and uses only sublinear, hardware-friendly cryptographic 
      operations from plain Learning With Errors. My work fundamentally eliminates 
      the periodic linear cost of Fully Homomorphic Encryption or database streaming
      for private hint table rebuild in prior single-server online-offline paradigm,
      achieving per-hint refresh on demand. 

  - name: "Pirex (PETS 2025)"
    link: "https://eprint.iacr.org/2024/719"
    text: >-                                               # (Markdown)
      is a two-server PIR with sublinear
      server complexity inherited from the online-offline 
      paradigm. My work achieves constant response bandwidth
      without the sublinear bandwidth or multiple parallel executions
      that prior approaches require for security. Its extension 
      [Pirex+](https://eprint.iacr.org/2024/719) further reduces client hint storage
      by offloading hint entries and their refreshes to the servers via oblivious
      reads and writes.


