# open: true shows the entry expanded when the page loads.
research:
  - role: "Graduate Researcher"
    place: "[Applied Crypto Group @ Virgnia Tech](https://thanghoang.github.io/#group)"
    when: "Jan 2023 - Present"
    open: true
    details: "Apart from my research, I also involve in the below projects, advised by Professor Thang Hoang."
    bullets:
      - "**Preprocessing PIR via Low-Degree Security**"
      - "**Distributed Oblivious RAM**"

  - role: "Research Student"
    place: "[Decentralized Cryptography Research Group - VNUHCM](https://www.fit.hcmus.edu.vn/research/g/decentralized-cryptography)"
    when: "Aug 2020 - Jul 2022"
    details: "I received early research guidance from Professor Thuc Nguyen on these undergraduate projects:"
    bullets:
      - |-
        **Biometric Cryptosystem and Authentication via Fuzzy Extractor**
        [[Report]](https://github.com/nhdvn/FuzzyExtractor/blob/main/THESIS_REPORT.pdf)
        [[Slides]](https://github.com/nhdvn/FuzzyExtractor/blob/main/THESIS_SLIDE.pdf)
        
        My work proposes an authentication system that regenerates multiple independent, 
        high-entropy cryptographic keys on demand from a single noisy, low-entropy biometric source. 
        It requires no persistent storage for user keys or biometrics.
        The server retains only non-sensitive helper data.
      
      - |-
        **A Threshold Variant for MuSig Schnorr Multi-Signature Scheme**
        [[Report]](https://github.com/nhdvn/multisig/blob/master/report_english.pdf)
        [[Slides]](https://github.com/nhdvn/multisig/blob/master/slide.pdf)

        My work proposes a threshold MuSig variant whose distributed key generation
        is rogue-key resistant via hash-weighted secret shares and publicly verifiable
        via polynomial commitments over NIST P-256, yielding one aggregate group key 
        and constant-size signatures with hidden signers.

