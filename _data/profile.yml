# ---- Summary (next to your photo) -------------------------------------------
#  Leave a blank line inside summary to start a new paragraph.
summary_lead: ""
summary: |-
  I am a fourth-year PhD Student in Applied Cryptography at Virginia Tech,
  advised by [Professor Thang Hoang](https://thanghoang.github.io/).
  Prior to this, I completed my Bachelor of Science in Computer Science (Honors Program)
  at University of Science - VNUHCM with a Research Thesis in
  Fuzzy Cryptography, advised by [Professor Thuc Nguyen](https://www.researchgate.net/profile/Thuc-Nguyen-16).
  
  My research builds computer systems for knowlegde retrieval that 
  deliver privacy and security at scale. I design algorithms and perform cryptanalysis to
  achieve simple protocols that are theoretically sound, concretely efficient and deployable.

