# ---- Selected research ------------------------------------------------------
# Each item reads as: <name, as a link> <text>
selected_research:
  - name: "Escape (S&P 2027)"
    link: "https://eprint.iacr.org/2026/2033"
    text: >-                                               # (Markdown)
      is a new Private Information Retrieval protocol for single-server
      setting that achieves constant response bandwidth cost while
      concretely using a minimal (sublinear) amount of 
      streamlined, hardware-friendly cryptographic operations
      based on plain Learning With Errors.

  - name: "Pirex (PETS 2025)"
    link: "https://eprint.iacr.org/2024/719"
    text: >-                                               # (Markdown)
      is a two-server Private Information Retrieval protocol with sublinear
      server complexity inherited from the online-offline preprocessing 
      paradigm. My work reduces the response bandwidth overhead of prior approaches 
      from sublinear to constant, while maintaining security without requiring 
      multiple parallel executions of the protocol.


