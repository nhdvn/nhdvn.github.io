# ---- Implementation ---------------------------------------------------------
# One card per project. Every field except `name` is optional: leave one out and
# that part of the card disappears. Tag colours: blue, purple, green, orange, olive, teal, red, pink, gray.
implementation:
  - name: "Escape Protocol"
    repo: "vt-asaplab/Escape"
    text: >-
      Experiment on 1 - 64 TiB databases with 8 - 64 KiB entries.
      Against previous OO-PIR, Escape achieves up to 56&times; lower latency
      and up to 420&times; lower bandwidth. Against lattice-based PIR, 
      Escape achieves 190&times; - 1575&times; lower latency
      and up to 1912&times; lower server time. 
    language: "C/C++"
    tags:
      - { name: "OO-PIR",  color: blue }
      - { name: "Learning With Errors", color: olive }
      - { name: "IFMA-52", color: pink }
      - { name: "Montgomery Reduction", color: pink }
    links:
      - { label: "Repository", url: "https://github.com/vt-asaplab/Escape" }
      - { label: "Paper",      url: "https://eprint.iacr.org/2026/2033" }

  - name: "Pirex Protocol"
    repo: "vt-asaplab/pirex"
    text: >-
      Experiment on 1 GiB - 1 TiB databases with 4 - 256 KiB entries.
      Against previous OO-PIR, Pirex achieves 165&times; - 728&times; lower latency and 
      65&times; - 910&times; lower bandwidth.
      As for client storage, Pirex+ reduces the cost from four to six orders of magnitude.
    language: ["C/C++", "Rust"]
    tags:
      - { name: "OO-PIR", color: blue }
      - { name: "Write-Only ORAM", color: purple }
      - { name: "SECP256K1", color: olive }
      - { name: "Exponential ElGamal", color: olive }
    links:
      - { label: "Repository", url: "https://github.com/vt-asaplab/pirex" }
      - { label: "Paper",      url: "https://eprint.iacr.org/2024/719" }

  - name: "Fuzzy Extractor"
    repo: "nhdvn/FuzzyExtractor"
    language: "Python, Go"
    text: >-
      Experiment on [DARPA TIMIT](https://ui.adsabs.harvard.edu/abs/1993STIN...9327403G/abstract) 
      speech dataset. The system produces 128-bit cryptographic secrets for authentication
      with False Acceptance Rate 0.02%. The underlying Composable Digital Locker achieves 96-bit 
      negligible error in reproducing secrets from an 80-bit low-entropy sample.
    tags:
      - { name: "Fuzzy Cryptography", color: teal }
      - { name: "Composable Digital Locker", color: teal }
      - { name: "Min Entropy", color: gray }
    links:
      - { label: "Repository", url: "https://github.com/nhdvn/FuzzyExtractor" }

  - name: "Threshold Signature"
    repo: "nhdvn/multisig"
    language: "Python"
    tags:
      - { name: "Elliptic Curve P-256", color: olive }
      - { name: "Polynomial Commitment", color: red }
      - { name: "Lagrange Interpolation", color: red }
    links:
      - { label: "Repository", url: "https://github.com/nhdvn/multisig" }


