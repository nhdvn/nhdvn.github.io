# ---- Research experience (newest first) -------------------------------------
# open: true shows the entry expanded when the page loads.
research:
  - role: "Graduate Researcher"
    place: "[Applied Crypto Group @ Virgnia Tech](https://thanghoang.github.io/#group)"
    when: "Jan 2023 - Present"
    open: true
    details: "Apart from my research, I also involve in the below projects, advised by Professor Thang Hoang."
    bullets:
      - "**Preprocessing PIR via Low-Degree Security**"
      - "**Distributed Oblivious RAM**"

  - role: "Research Student"
    place: "[Decentralized Cryptography Research Group - VNUHCM](https://www.fit.hcmus.edu.vn/research/g/decentralized-cryptography)"
    when: "Aug 2020 - Jul 2022"
    details: "I received early research guidance from Professor Thuc Nguyen on these undergraduate projects:"
    bullets:
      - |-
        **Biometric Cryptosystem and Authentication via Fuzzy Extractor** [[PDF]](https://www.overleaf.com/read/sztkkvjqvzkd#78e1ce)
        
        My work proposes an authentication system that regenerates multiple independent, 
        high-entropy cryptographic keys on demand from a single noisy, low-entropy biometric source. 
        Neither the user keys nor biometrics are stored remotely. The server retains only non-sensitive helper data.
      
      - |-
        **A Threshold Variant for MuSig Schnorr Multi-Signature Scheme** [[PDF]](https://github.com/nhdvn/multisig/blob/master/report_english.pdf)
        
        My work proposed a threshold variant of MuSig with distributed key generation, where
        hash-weighted shares prevent rogue-key attacks, while publicly verifiable polynomial
        commitments over ECC P-256 yield one aggregated group key and a constant-size signature
        with hidden signers.

