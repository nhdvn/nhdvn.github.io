# ---- Industry experience (newest first) -------------------------------------
industry:
  - role: "Cloud Security Intern"
    place: "[Fossil Group - Center for Wearables Research](https://www.fossilgroup.com/apac-careers/corporate-apac/fossil-vietnam-jobs/)"
    when: "May 2022 - Dec 2022"
    open: true
    details: "I was fortunate to be the first intern in the security team and contributed to the below projects."
    bullets:
      - |-
        **Enhancing Security Posture Assessment for Cloud Inventory**
        
        My work built CVE monitoring across hundreds of cloud computing assets and introduced
        security model objects which link CVE findings (its machine, cluster,
        and designated team) to a hierarchical cross-entity graph relation, surfacing high-risk
        misconfigurations.

      - |-
        **Reducing Manual Triage on Software and Network Vulnerabilities**
        
        I developed two modules that (1) probed hundreds of internal and external subdomains for
        HTTP status, routing paths, gateways, authentication and TLS exposure, and 
        (2) monitored SCA/SAST results from pull requests
        across hundreds of internal repos to issue tickets to designated teams. 

  - role: "Security Research Intern"
    place: "Stealth Startup"
    when: "Nov 2020 - Mar 2021"
    details: "I had an opportunity to practice the following ethical security research projects at a local startup."
    bullets:
      - |-
        **Fileless Execution Forensics on Windows**

        My work analyzed how legacy NetMeeting installer (instnm.exe) and auto-elevating
        System File Checker (sfc.exe) can execute untrusted code from nonstandard paths and
        offline OS images.

      - |-
        **Evasion and Persistence Mechanisms on Windows**

        My work measured how runtime and on-disk detection hold up against thread hijacking,
        API/IAT hooking, DLL proxying, and custom PE loaders which run payloads in memory
        through reflective DLL injection and process hollowing variants.

      - |-
        **Privilege Escalation and Memory Analysis on Linux**

        My work studied stack and heap corruption for ROP/JOP code-reuse attacks
        against OS hardening (ASLR, NX, StackGuard, PIE)
        and ELF linking constraints (PLT/GOT, RELRO, ASCII-Armor).
