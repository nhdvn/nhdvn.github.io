---
layout: default
---

<article>
  <header><h1>Tag: {{ page.tag }}</h1></header>
  <ul class="archive">
    {% for post in site.tags[page.tag] %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ul>
</article>
