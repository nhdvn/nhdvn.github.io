<head>
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>

    <meta charset="{{ site.encoding }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
    <meta name="author" content="{{ page.author | default: site.author | escape }}">
    <meta name="generator" content="Jekyll v{{ jekyll.version }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <link rel="icon" type="image/png" href="/assets/favicon.png">
    
    <link rel="stylesheet" href="{{ "/assets/css/classes.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/index.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/sidebar.css" | relative_url }}" media="screen and (min-width: 70em)">
    <link rel="alternate" href="{{ "/feed.xml" | relative_url }}" type="application/atom+xml" title="{{ site.title }}">
    
    <script type="text/javascript">
        window.MathJax = {
          tex: {
            packages: ['base', 'ams']
          },
          loader: {
            load: ['ui/menu', '[tex]/ams']
          },
          chtml: {
            scale: 1,                      // global scaling factor for all expressions
            minScale: 1.1,                   // smallest scaling factor to use
            mtextInheritFont: false,       // true to make mtext elements use surrounding font
            merrorInheritFont: false,      // true to make merror text use surrounding font
            mtextFont: '',                 // font to use for mtext, if not inheriting (empty means use MathJax fonts)
            merrorFont: 'serif',           // font to use for merror, if not inheriting (empty means use MathJax fonts)
            unknownFamily: 'serif',        // font to use for character that aren't in MathJax's fonts
            mathmlSpacing: false,          // true for MathML spacing rules, false for TeX rules
            skipAttributes: {},            // RFDa and other attributes NOT to copy to the output
            exFactor: .5,                  // default size of ex in em units
            displayAlign: 'center',        // default for indentalign when set to 'auto'
            displayIndent: '0'             // default for indentshift when set to 'auto'
          }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        html {text-align: justify;}
    </style>
</head>
